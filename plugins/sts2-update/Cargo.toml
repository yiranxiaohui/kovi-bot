[package]
name = "kovi-plugin-sts2-update"
version = "0.1.0"
edition = "2024"
description = "Kovi plugin: Slay the Spire 2 patch notifications with Chinese translation"
license = "MIT OR Apache-2.0"

[lib]
name = "kovi_plugin_sts2_update"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
kovi = "0.13"
kovi-onebot = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
