[package]
name = "kovi-plugin-cs2-stats"
version = "0.1.0"
edition = "2024"
description = "Kovi plugin: CS2 Steam profile and statistics lookup"
license = "MIT OR Apache-2.0"

[lib]
name = "kovi_plugin_cs2_stats"
path = "src/lib.rs"

[dependencies]
kovi = "0.13"
kovi-onebot = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
