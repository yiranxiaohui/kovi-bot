[package]
name = "kovi-plugin-ai"
version = "0.0.2"
edition = "2024"
description = "kovi plugin: AI 对话 + 生图 + 改图"
license = "MIT OR Apache-2.0"

[dependencies]
kovi = ">=0.13"
kovi-onebot = ">=0.13"
rig-core = "0.27.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
